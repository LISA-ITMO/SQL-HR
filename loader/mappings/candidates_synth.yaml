# Соответствие для data/candidates_synth.csv (исходный формат SQL-HR, 108 колонок).
# Слева поле таблицы candidates, справа колонка (или колонки) CSV.
# Заполняет те же поля и из тех же колонок, что db/add_rows.sql, чтобы результаты можно было сравнить.
# Отличия: текст склеивается в формате «Колонка: значение; …», а education_count = NULL,
# если дипломов не отмечено, но часть колонок пуста (в add_rows.sql это 0). См. loader/README.md.
#
# Простая запись:   поле: "Колонка CSV"
# Расширенная:      поле: {column: "...", type: date}
# Склейка текста:   поле: {columns: ["Колонка 1", "Колонка 2"]}  (в тексте: «Колонка: значение; …»)
# Типы: text (по умолчанию), date, number, int, count_true, experience_years, citizenship.

fields:
  date_received: "Дата поступления документов"
  last_name: "Фамилия"
  first_name: "Имя"
  middle_name: "Отчество"
  previous_last_name: "Последняя прежняя фамилия"
  sex: "Пол"
  birth_date: "Дата рождения"
  birth_place: "Место рождения"
  snils: "СНИЛС"
  passport_number: "Паспорт (серия, номер)"
  passport_issued: "Паспорт (кем и когда выдан)"
  phone_mobile: "Номер телефона (моб)"
  phone_2: "Номер телефона 2"
  phone_3: "Номер телефона 3"
  email_1: "e-mail (1)"
  email_2: "e-mail (2)"
  email_upgo: "e-mail УПГО"
  residence_area: "Место проживания (район)"
  appointment_date: "Дата назначения"
  dismissal_date: "Дата увольнения"
  confirmed_experience_years:
    type: experience_years          # (дата увольнения - дата назначения) / 365,25
    start: "Дата назначения"
    end: "Дата увольнения"
  source_info: "Откуда вы узнали о МКР?"
  education_text:
    columns:
      - "Образование (ВУЗ)"
      - "Образование (наименование)"
      - "2 Образование (ВУЗ)"
      - "2 Образование (наименование)"
      - "3 Образование (ВУЗ)"
      - "3 Образование (наименование)"
  education_count:
    type: count_true                # сколько отмечено «Наличие диплома» (пустая ячейка = неизвестно)
    columns: ["Наличие диплома", "2 Наличие диплома", "3 Наличие диплома"]
  work_text:
    columns:
      - "Организация"
      - "Подразделение"
      - "Должность"
      - "Вид контракта"
      - "Трудоустройство"
      - "Work (орган)"
      - "Work (должность)"
      - "Work (результат)"
      - "2_Work (орган)"
      - "2_Work (должность)"
      - "2_Work (результат)"
      - "3_Work (орган)"
      - "3_Work (должность)"
      - "3_Work (результат)"
      - "4_Work (орган)"
      - "4_Work (должность)"
      - "4_Work (результат)"
  extra_info_text:
    columns:
      - "Направление"
      - "Дополнительная информация"
      - "Вывод"
      - "Вывод по тестированию (1 этап)"
      - "Вывод по собеседованию (2 этап)"
      - "Особенности оценки"
      - "Комментарии из заключения (особенности)"
      - "Комментарии из заключения (рекомендованная деятельность)"
      - "Комментарии по трудоустройству"
      - "Информация о ранних подачах"
      - "Сфера интересов"
  status: "Статус"
  ready_to_work: "Готовность к работе"
  citizenship:
    type: citizenship               # «РФ», если в тексте паспорта есть россия/россии/рф
    column: "Паспорт (кем и когда выдан)"
